server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    max-connections: 10000
    accept-count: 1024
    connection-timeout: 10s

spring:
  application:
    name: policy-desk
  threads:
    virtual:
      enabled: true            # one cheap virtual thread per request, so long SSE streams scale
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/policydesk}
    username: ${DB_USER:policydesk}
    password: ${DB_PASSWORD:policydesk}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      validation-timeout: 2000
  web:
    resources:
      static-locations: file:${STATIC_DIR:../web/dist}/
  ai:
    model:
      chat: ${LLM_PROVIDER:mock}      # "openai" enables the OpenAI-compatible chat model; anything else uses the offline mock
      embedding: transformers         # local ONNX embeddings
    openai:
      api-key: ${LLM_API_KEY:not-set}
      base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}
          temperature: 0.2
    embedding:
      transformer:
        cache:
          directory: ${MODEL_CACHE_DIR:${user.home}/.cache/policy-desk}/embeddings
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 384
        index-type: HNSW
        distance-type: COSINE_DISTANCE

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
